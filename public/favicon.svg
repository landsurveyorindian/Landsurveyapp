<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#grad)"/>
  <!-- Cadastral polygon boundary -->
  <polygon points="14,46 22,18 48,14 52,42 34,50" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Corner survey markers -->
  <circle cx="14" cy="46" r="3" fill="#ffffff"/>
  <circle cx="22" cy="18" r="3" fill="#ffffff"/>
  <circle cx="48" cy="14" r="3" fill="#ffffff"/>
  <circle cx="52" cy="42" r="3" fill="#ffffff"/>
  <circle cx="34" cy="50" r="3" fill="#ffffff"/>
  <!-- Center compass / target pin -->
  <circle cx="34" cy="32" r="4.5" fill="#38bdf8"/>
  <circle cx="34" cy="32" r="1.5" fill="#ffffff"/>
</svg>
